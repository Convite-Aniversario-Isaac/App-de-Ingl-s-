 var c=wpick(ABC,function(x){return 'l:'+x},L);var opts=[c].concat(sample(ABC.filter(function(x){return x!==c}),3));
 return {type:'choice',key:'l:'+c,prompt:'🔊',sub:'Qual letra você ouviu?',say:c+'.',auto:true,

function genHear(L){
 var D=LANGS[L];var idx=VOC.map(function(_,i){return i});var i=wpick(idx,function(x){return 'v:'+x},L);
 var word=D.vocab[i],emo=VOC[i][0],pt=VOC[i][1];var ids=shuffle([i].concat(sample(idx.filter(function(x){return x!==i}),3)));var v=rnd(3);
 if(v===0)return {type:'choice',key:'v:'+i,prompt:'🔊',sub:'Toque na imagem certa',say:word,auto:true,emoji:true,opts:ids.map(function(x){return {t:VOC[x][0],ok:x===i}}),explain:word+' = '+pt};
 if(v===1)return {type:'choice',key:'v:'+i,prompt:word,big:true,sub:'O que significa?',say:word,auto:false,opts:ids.map(function(x){return {t:VOC[x][1],ok:x===i}}),explain:word+' = '+pt};
 return {type:'choice',key:'v:'+i,prompt:emo,big:true,sub:'Como se diz em '+D.name+'?',say:word,auto:false,opts:ids.map(function(x){return {t:D.vocab[x],ok:x===i}}),explain:word+' = '+pt};

function genMatch(L){

}
function genOrder(L,fi){
 var D=LANGS[L];var i=(fi===undefined?rnd(D.phrases.length):fi);var t=tok(D.phrases[i]);var b=shuffle(t),tries=0;while(b.join('|')===t.join('|')&&tries++<6)b=shuffle(t);
 return {type:'order',key:'p:'+i,pt:PHR[i],say:t.join(' '),tokens:t,bank:b,explain:t.join(' ')};
}
function genGap(L,fi){
 var D=LANGS[L];var i=(fi===undefined?rnd(D.phrases.length):fi);var t=tok(D.phrases[i]);var gi=0,best=0;
 t.forEach(function(w,k){var c=strip(w);if(c.length>best){best=c.length;gi=k}});
 var ans=strip(t[gi]);var pool=[];
 D.phrases.forEach(function(p){tok(p).forEach(function(w){pool.push(strip(w))})});D.vocab.forEach(function(w){pool.push(w)});
 pool=pool.filter(function(x,k){return pool.indexOf(x)===k&&x.length>1&&norm(x)!==norm(ans)});
 var opts=shuffle([ans].concat(sample(pool,3)));
 var shown=t.map(function(w,k){return k===gi?w.replace(ans,'_____'):w}).join(' ');
 return {type:'choice',key:'p:'+i,prompt:shown,small:true,sub:PHR[i],say:t.join(' '),auto:false,opts:opts.map(function(x){return {t:x,ok:x===ans}}),explain:t.join(' ')};
}
function genSpeak(L){
 var D=LANGS[L];
 if(rng()<0.5){var i=rnd(VOC.length);return {type:'speak',key:'v:'+i,target:D.vocab[i],pt:VOC[i][1],emo:VOC[i][0],explain:'Era: '+D.vocab[i]}}

}
function genDaily(L){var g=[genNumber,genHear,genGap,genOrder,genLetter,genHear,genGap];return g[rnd(g.length)](L)}

var VIDS=VOC.map(function(_,i){return i});
function pdone(L,id){return ((S.path&&S.path[L])||{})[id]||0}
function unlocked(i){return i===0||pdone(S.lang,LESSONS[i-1].id)>0}
function dpick(pool,all,c,n){var o=sample(pool.filter(function(x){return x!==c}),n);
 if(o.length<n){var rest=all.filter(function(x){return x!==c&&o.indexOf(x)<0});o=o.concat(sample(rest,n-o.length))}return o}
function exV(L,i,kind,pool){
 var D=LANGS[L],ids=shuffle([i].concat(dpick(pool,VIDS,i,3))),ex=D.vocab[i]+' = '+VOC[i][1];
 if(kind==='hear')return {type:'choice',key:'v:'+i,prompt:'🔊',sub:'Toque na imagem certa',say:D.vocab[i],auto:true,emoji:true,opts:ids.map(function(x){return {t:VOC[x][0],ok:x===i}}),explain:ex};
 if(kind==='mean')return {type:'choice',key:'v:'+i,prompt:D.vocab[i],big:true,sub:'O que significa?',say:D.vocab[i],auto:false,opts:ids.map(function(x){return {t:VOC[x][1],ok:x===i}}),explain:ex};
 if(kind==='word')return {type:'choice',key:'v:'+i,prompt:VOC[i][0],big:true,sub:'Como se diz em '+D.name+'?',say:D.vocab[i],auto:false,opts:ids.map(function(x){return {t:D.vocab[x],ok:x===i}}),explain:ex};
 return {type:'type',key:'v:'+i,sub:'Escreva em '+D.name,prompt:VOC[i][0],hint:VOC[i][1],answer:D.vocab[i],explain:ex};
}
function exN(L,n,kind,pool){
 var D=LANGS[L],w=numWord(L,n),ids=shuffle([n].concat(dpick(pool,NUMVALS,n,3))),ex=w+' = '+n;
 if(kind==='hear')return {type:'choice',key:'n:'+n,prompt:'🔊',sub:'Que número você ouviu?',say:w,auto:true,opts:ids.map(function(x){return {t:String(x),ok:x===n}}),explain:ex};
 if(kind==='num2w')return {type:'choice',key:'n:'+n,prompt:String(n),big:true,sub:'Como se escreve em '+D.name+'?',say:w,auto:false,opts:ids.map(function(x){return {t:numWord(L,x),ok:x===n}}),explain:ex};
 if(kind==='w2num')return {type:'choice',key:'n:'+n,prompt:w,small:true,sub:'Que número é este?',say:w,auto:false,opts:ids.map(function(x){return {t:String(x),ok:x===n}}),explain:ex};
 return {type:'type',key:'n:'+n,sub:'Escreva por extenso em '+D.name,prompt:String(n),hint:'',answer:w,explain:ex};
}
function exP(L,j,kind){
 var D=LANGS[L],idx=[0,1,2,3,4,5],ids=shuffle([j].concat(sample(idx.filter(function(x){return x!==j}),3)));
 if(kind==='hear')return {type:'choice',key:'p:'+j,prompt:'🔊',sub:'Toque no que você ouviu',say:D.phrases[j],auto:true,wide:true,opts:ids.map(function(x){return {t:D.phrases[x],ok:x===j}}),explain:D.phrases[j]};
 if(kind==='mean')return {type:'choice',key:'p:'+j,prompt:PHR[j],small:true,sub:'Como se diz em '+D.name+'?',wide:true,opts:ids.map(function(x){return {t:D.phrases[x],ok:x===j}}),explain:D.phrases[j]};
 if(kind==='order')return genOrder(L,j);
 return genGap(L,j);
}
function buildLesson(L,les){
 var D=LANGS[L],ids=les.ids,teach=[],ex=[],tail=[],i;
 if(les.k==='v'){
  ids.forEach(function(i){teach.push({type:'teach',sub:'Palavra nova',big:VOC[i][0],word:D.vocab[i],pt:VOC[i][1],say:D.vocab[i]});
   ex.push(exV(L,i,'hear',ids),exV(L,i,'word',ids));if(ids.length<4)ex.push(exV(L,i,'mean',ids))});
  ex=shuffle(ex);
  var mi=sample(ids,Math.min(5,ids.length));
  ex.push({type:'match',key:'m',ids:mi,left:shuffle(mi),right:shuffle(mi),vocab:D.vocab,explain:''});
  shuffle(ids).slice(0,4).forEach(function(i){tail.push(exV(L,i,'type',ids))});
 }else if(les.k==='n'){
  ids.forEach(function(n){teach.push({type:'teach',sub:'Número novo',big:String(n),word:numWord(L,n),pt:'',say:numWord(L,n)});
   ex.push(exN(L,n,'hear',ids),exN(L,n,rng()<0.5?'num2w':'w2num',ids))});
  ex=shuffle(ex);
  sample(ids,Math.min(4,ids.length)).forEach(function(n){tail.push(exN(L,n,'type',ids))});
 }else if(les.k==='p'){
  ids.forEach(function(j){teach.push({type:'teach',sub:'Frase nova',big:'💬',word:D.phrases[j],pt:PHR[j],say:D.phrases[j],small:true});
   ex.push(exP(L,j,'hear'),exP(L,j,'mean'),exP(L,j,'order'),exP(L,j,'gap'))});
  ex=shuffle(ex);
 }else{
  var vs=sample(VIDS,3),ns=sample(NUMVALS,3),ps=sample([0,1,2,3,4,5],2);
  vs.forEach(function(i){ex.push(exV(L,i,'hear',VIDS),exV(L,i,'word',VIDS))});
  ns.forEach(function(n){ex.push(exN(L,n,'hear',NUMVALS),exN(L,n,'num2w',NUMVALS))});
  ps.forEach(function(j){ex.push(exP(L,j,'order'),exP(L,j,'gap'))});
  ex=shuffle(ex);
  vs.slice(0,2).forEach(function(i){tail.push(exV(L,i,'type',VIDS))});
 }
 return teach.concat(ex,tail);
}

 G={path:true,li:i,mode:'path',L:L,qs:qs,i:0,lives:5,max:5,base:base,score:0,streak:0,right:0,wrong:0,locked:false,tm:null,to:null,sel:[],ms:null};
 show();
}

 LESSONS.forEach(function(les,i){

 });
 return h+'</div>';
}

function show(){
 var q=G.qs[G.i];G.locked=false;G.sel=[];clearTimer();
 app.innerHTML='<div class="top"><button class="ib" data-act="quit">✕</button><div class="hearts">'+hearts()+'</div><div class="sc">⭐ <b id="sc">'+G.score+'</b></div></div>'
  +'<div class="prog"><i style="width:'+(G.path?Math.min(100,G.right/G.base*100):G.i/G.qs.length*100)+'%"></i></div>'
  +(q.time?'<div class="tbar"><i id="tb"></i></div>':'')
  +'<div class="card" id="qc"></div><div id="fbw"></div>';
 var qc=$('#qc'),D=LANGS[G.L],h='';
 if(q.type==='choice'){
  h+='<div class="sub">'+esc(q.sub||'')+'</div>';
  if(q.prompt==='🔊')h+='<button class="bigspk" data-act="say">🔊</button>';
  else{h+='<div class="prompt'+(q.big?' big':'')+(q.small?' small':'')+'">'+(q.promptHtml||esc(q.prompt))+'</div>';if(q.say)h+='<button class="spk" data-act="say">🔊 Ouvir</button>'}
  h+='<div class="opts'+(q.emoji?' emo':'')+(q.wide?' wide':'')+'">';
  q.opts.forEach(function(o,k){h+='<button class="opt" data-act="pick" data-k="'+k+'">'+(o.h||esc(o.t))+'</button>'});
  h+='</div>';qc.innerHTML=h;
  if(q.say&&q.auto)setTimeout(function(){speak(q.say,D.tts)},250);
  if(q.time)startTimer(q.time);
 }else if(q.type==='order'){
  qc.innerHTML='<div class="sub">'+(q.sub||('Monte a frase em '+D.name))+'</div><div class="prompt small">'+esc(q.pt)+'</div><button class="spk" data-act="say">🔊 Ouvir</button><div class="ans" id="ans"></div><div class="bank" id="bank"></div><button class="go" data-act="check">Verificar</button>';
  drawOrder();
 }else if(q.type==='match'){
  G.ms={l:null,r:null,done:{}};
  qc.innerHTML='<div class="sub">Ligue cada palavra à sua tradução</div><div class="mcols"><div id="ml"></div><div id="mr"></div></div>';
  drawMatch();
 }else if(q.type==='speak'){
  qc.innerHTML='<div class="sub">Repita em voz alta</div><div class="prompt big">'+q.emo+'</div><div class="prompt small">'+esc(q.target)+'</div><div class="hint">'+esc(q.pt)+'</div><button class="spk" data-act="say">🔊 Ouvir</button><button class="mic" data-act="mic">🎤 Falar</button><div class="hint" id="heard"></div><button class="skip" data-act="skip">Pular</button>';
 }else if(q.type==='teach'){
  qc.innerHTML='<div class="sub">'+q.sub+'</div><div class="prompt big">'+(q.bigHtml||esc(q.big))+'</div><div class="prompt'+(q.small?' small':'')+'">'+esc(q.word)+'</div>'+(q.pt?'<div class="hint">'+esc(q.pt)+'</div>':'')+'<button class="spk" data-act="say">🔊 Ouvir</button><button class="go" data-act="next">Continuar</button>';
  setTimeout(function(){speak(q.say,D.tts)},250);
 }else if(q.type==='type'){
  qc.innerHTML='<div class="sub">'+esc(q.sub)+'</div><div class="prompt big">'+(q.promptHtml||esc(q.prompt))+'</div>'+(q.hint?'<div class="hint">'+esc(q.hint)+'</div>':'')+'<input id="tin" class="tin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="go" data-act="tcheck">Verificar</button>';
  var ti=$('#tin');if(ti)setTimeout(function(){ti.focus()},150);
 }else if(q.type==='pairs'){
  G.ms={l:null,r:null,done:{}};
  qc.innerHTML='<div class="sub">Ligue cada palavra à sua tradução</div><div class="mcols"><div id="ml"></div><div id="mr"></div></div>';
  drawPairs();
 }else if(q.type==='wsearch'){
  G.ws={start:null,found:{},cells:{}};
  qc.innerHTML='<div class="sub">Caça-palavras: toque na primeira e na última letra de cada palavra</div><div id="wsb"></div>';
  drawWs();
 }
}

/* --- escrever a resposta --- */
function tcheck(){
 if(G.locked)return;var q=G.qs[G.i],ti=$('#tin'),v=ti?ti.value:'';
 if(!v.trim()){toast('Escreva a resposta.');return}
 ti.disabled=true;
 function cl(x){return norm(String(x).replace(/-/g,' '))}
 resolve(cl(v)===cl(q.answer),q,0,q.answer);
}

/* --- cronômetro (Corrida de números) --- */
function startTimer(ms){
 var t0=performance.now(),bar=$('#tb');
 G.tm=setInterval(function(){var f=Math.max(0,1-(performance.now()-t0)/ms);if(bar)bar.style.width=(f*100)+'%';if(f<=0){clearTimer();timeUp()}},60);
}
function timeUp(){
 if(!G||G.locked)return;var q=G.qs[G.i];G.locked=true;
 document.querySelectorAll('.opt').forEach(function(b,j){b.disabled=true;if(q.opts[j].ok)b.classList.add('ok')});
 resolve(false,q,0,'⏱ Tempo! '+q.explain);
}

/* --- resposta e feedback --- */
function penalty(key){G.streak=0;G.wrong++;G.lives--;miss(G.L,key);beep(false);updateHud()}
function fb(type,msg,needBtn){
 var w=$('#fbw');if(!w)return;
 w.innerHTML='<div class="fb '+type+'">'+esc(msg)+'</div>'+(needBtn?'<button class="go" data-act="next">Continuar</button>':'');
 if(!needBtn)G.to=setTimeout(next,900);
}
function resolve(ok,q,pts,msg){
 if(pts===0)pts=undefined;
 G.locked=true;
 if(ok){G.streak++;G.right++;var p=pts||(10+Math.min(G.streak,5)*2);G.score+=p;hit(G.L,q.key);beep(true);updateHud();
  fb('good',['Muito bem!','Isso aí!','Perfeito!','Mandou bem!'][rnd(4)]+' +'+p,false)}
 else{penalty(q.key);
  if(G.path&&q.type!=='match'&&q.type!=='pairs'&&q.type!=='wsearch'){var c=Object.assign({},q);if(c.opts)c.opts=shuffle(c.opts);G.qs.push(c)}
  fb('bad',(G.path?'Resposta correta: ':'')+(msg||q.explain),true)}
}
function next(){
 if(!G)return;if(G.to){clearTimeout(G.to);G.to=null}
 if(G.lives<=0||G.i+1>=G.qs.length){end();return}
 G.i++;show();
}
function pick(k){
 if(G.locked)return;var q=G.qs[G.i],o=q.opts[k];G.locked=true;clearTimer();
 var bs=document.querySelectorAll('.opt');
 bs.forEach(function(b,j){b.disabled=true;if(q.opts[j].ok)b.classList.add('ok')});
 if(!o.ok)bs[k].classList.add('bad');
 resolve(o.ok,q);
}

/* --- Montar a frase --- */
function drawOrder(){
 var q=G.qs[G.i],a='',b='';
 G.sel.forEach(function(k){a+='<button class="tk" data-act="unpick" data-k="'+k+'">'+esc(q.bank[k])+'</button>'});
 q.bank.forEach(function(w,k){b+='<button class="tk'+(G.sel.indexOf(k)>=0?' used':'')+'" '+(G.sel.indexOf(k)>=0?'disabled ':'')+'data-act="take" data-k="'+k+'">'+esc(w)+'</button>'});
 $('#ans').innerHTML=a;$('#bank').innerHTML=b;
}
function take(k){if(G.locked||G.sel.indexOf(k)>=0)return;G.sel.push(k);drawOrder()}
function unpick(k){if(G.locked)return;G.sel=G.sel.filter(function(x){return x!==k});drawOrder()}
function check(){
 if(G.locked)return;var q=G.qs[G.i];
 if(G.sel.length<q.tokens.length){toast('Use todas as palavras.');return}
 var arr=G.sel.map(function(k){return q.bank[k]});
 resolve(arr.join(' ')===q.tokens.join(' '),q);
}

/* --- Pareamento --- */
function drawMatch(){
 var q=G.qs[G.i],m=G.ms,l='',r='';
 q.left.forEach(function(id){var cls='mt'+(m.done[id]?' ok':'')+(m.l===id?' sel':'');l+='<button class="'+cls+'" '+(m.done[id]?'disabled ':'')+'data-act="mtap" data-s="l" data-id="'+id+'">'+esc(VOC[id][1])+'</button>'});
 q.right.forEach(function(id){var cls='mt'+(m.done[id]?' ok':'')+(m.r===id?' sel':'');r+='<button class="'+cls+'" '+(m.done[id]?'disabled ':'')+'data-act="mtap" data-s="r" data-id="'+id+'">'+esc(q.vocab[id])+'</button>'});
 $('#ml').innerHTML=l;$('#mr').innerHTML=r;
}
function mtap(side,id){
 if(G.locked)return;var q=G.qs[G.i],m=G.ms;
 if(side==='l')m.l=(m.l===id?null:id);else{m.r=(m.r===id?null:id);if(m.r!==null)speak(q.vocab[id],LANGS[G.L].tts)}
 if(m.l!==null&&m.r!==null){
  if(m.l===m.r){
   m.done[m.l]=true;G.score+=4;hit(G.L,'v:'+m.l);beep(true);updateHud();m.l=null;m.r=null;drawMatch();
   if(Object.keys(m.done).length===q.ids.length)resolve(true,q,10);
  }else{
   penalty('v:'+m.l);m.l=null;m.r=null;drawMatch();
   if(G.lives<=0){G.locked=true;fb('bad','Suas vidas acabaram.',true)}
  }
 }else drawMatch();
}

/* --- Falar --- */
function mic(){
 if(G.locked)return;var q=G.qs[G.i];
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('Seu navegador não reconhece voz. Use o Chrome ou toque em Pular.');return}
 var r=new SR(),heard=$('#heard');r.lang=LANGS[G.L].tts;r.maxAlternatives=5;r.interimResults=false;
 heard.textContent='Ouvindo…';
 r.onresult=function(e){
  var alts=[];for(var i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);
  var ok=alts.some(function(a){return close(a,q.target)});
  if($('#heard'))$('#heard').textContent='Você disse: '+alts[0];
  resolve(ok,q);
 };
 r.onerror=function(e){if($('#heard'))$('#heard').textContent=e.error==='not-allowed'?'Permita o microfone nas configurações do navegador.':'Não consegui ouvir. Tente de novo.'};
 r.onend=function(){var h=$('#heard');if(!G||G.locked||!h)return;if(h.textContent==='Ouvindo…')h.textContent='Não ouvi nada. Tente de novo.'};
 try{r.start()}catch(e){}
}
function skip(){if(G.locked)return;G.locked=true;G.qs[G.i].skipped=true;next()}

/* --- fim da partida --- */
function endLesson(){
 clearTimer();var les=G.th?thLes(G):LESSONS[G.li],L=G.L,won=G.lives>0;
 if(!won){save();
  app.innerHTML='<div class="res"><div class="muted">'+les.ic+' '+esc(les.t)+'</div><div class="stars">💔</div><div class="big">Suas vidas acabaram</div><div class="muted">Sem problema! Os erros ficam guardados para revisão.</div><button class="go" data-act="again">Tentar de novo</button><button class="go" style="background:#ffffff22" data-act="home">Início</button></div>';
  return}
 var stars=G.wrong===0?3:(G.wrong<=2?2:1),bonus=10;
 if(S.last!==today()){S.streak=(S.last===yesterday())?S.streak+1:1;S.last=today()}
 S.xp+=G.score+bonus;S.langs[L]=1;
 var store=G.th?(S.th=S.th||{},S.th[L]=S.th[L]||{}):(S.path=S.path||{},S.path[L]=S.path[L]||{});
 if(stars>(store[les.id]||0))store[les.id]=stars;
 if(G.wrong===0)S.perfect++;
 save();
 var nx=G.th?(G.gi+1<thById(G.th).groups.length):(G.li+1<LESSONS.length);
 app.innerHTML='<div class="res"><div class="muted">'+les.ic+' '+esc(les.t)+' · '+LANGS[L].name+'</div><div class="stars">'+'⭐'.repeat(stars)+'☆'.repeat(3-stars)+'</div><div class="big">Lição concluída!</div>'
  +'<div class="chip">+'+(G.score+bonus)+' pontos</div><div class="chip">Erros: '+G.wrong+'</div>'
  +(nx?(G.th?'<button class="go" data-act="tlesson" data-t="'+G.th+'" data-g="'+(G.gi+1)+'">Próxima lição</button>':'<button class="go" data-act="lesson" data-i="'+(G.li+1)+'">Próxima lição</button>'):'')
  +'<button class="go" style="background:#ffffff22" data-act="'+(G.th?'theme" data-t="'+G.th:'home')+'">'+(G.th?'Voltar ao tema':'Voltar à trilha')+'</button></div>';
}
function end(){
 if(G.path){endLesson();return}
 clearTimer();var M=MODES[G.mode],total=G.right+G.wrong,acc=total?Math.round(G.right/total*100):0,won=G.lives>0;
 var bonus=0;if(G.mode==='daily'&&won&&S.daily!==today()){bonus=50;S.daily=today()}
 if(total>0&&S.last!==today()){S.streak=(S.last===yesterday())?S.streak+1:1;S.last=today()}
 S.xp+=G.score+bonus;S.langs[G.L]=1;
 var bk=G.mode+'_'+G.L;if(G.score>(S.best[bk]||0))S.best[bk]=G.score;
 if(won&&G.wrong===0&&total>0)S.perfect++;
 save();
 var stars=!won?0:(acc>=90?3:(acc>=70?2:1));
 app.innerHTML='<div class="res"><div class="muted">'+M.icon+' '+M.name+' · '+LANGS[G.L].name+'</div>'
  +'<div class="stars">'+(stars?'⭐'.repeat(stars)+'☆'.repeat(3-stars):'💔')+'</div>'
  +'<div class="big">'+(won?'Muito bem!':'Fim das vidas')+'</div>'
  +'<div class="chip">Pontos: '+G.score+(bonus?' + '+bonus+' de bônus':'')+'</div>'
  +'<div class="chip">Acertos: '+G.right+' · Erros: '+G.wrong+' · '+acc+'%</div>'
  +'<button class="go" data-act="again">Jogar de novo</button><button class="go" style="background:#ffffff22" data-act="home">Início</button></div>';
}

/* ============ EVENTOS ============ */
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
 var map={
  lang:function(){S.lang=b.dataset.l;save();home()},
  play:function(){start(b.dataset.m)},
  home:home,
  quit:function(){if(b.dataset.arm==='1'){home();return}b.dataset.arm='1';b.textContent='Sair?';b.style.width='auto';b.style.padding='0 12px';b.style.background='#ff5a6e';setTimeout(function(){if(b.isConnected){b.dataset.arm='';b.textContent='✕';b.style.cssText=''}},2500)},
  say:function(){var q=G.qs[G.i];speak(q.say||q.target,LANGS[G.L].tts)},
  pick:function(){pick(+b.dataset.k)},
  take:function(){take(+b.dataset.k)},
  unpick:function(){unpick(+b.dataset.k)},
  check:check,
  mtap:function(){mtap(b.dataset.s,+b.dataset.id)},
  mic:mic,
  skip:skip,
  next:next,
  lesson:function(){var i=+b.dataset.i;if(!unlocked(i)){toast('Termine a lição anterior primeiro.');return}startLesson(i)},
  tcheck:tcheck,
  theme:function(){themeScreen(b.dataset.t)},
  tlesson:function(){startThemeLesson(b.dataset.t,+b.dataset.g)},
  ptap:function(){ptap(b.dataset.s,+b.dataset.id)},
  wtap:function(){wtap(+b.dataset.r,+b.dataset.c)},
  again:function(){G.th?startThemeLesson(G.th,G.gi):G.path?startLesson(G.li):start(G.mode)}
 };
 if(map[a])map[a]();
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='tin'){e.preventDefault();tcheck()}});
home();
})();
</script>
